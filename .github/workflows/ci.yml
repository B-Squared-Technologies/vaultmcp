name: CI

# Actions minutes are a shared monthly budget and macOS bills at 10x,
# Windows at 2x (Nov 2026: the org hit 90% by the 20th). So:
# - PRs into develop test on Linux only;
# - release PRs into main run the full macOS + Windows matrix, the gate
#   before anything ships, so the real-keychain code is still proven on
#   every OS before release;
# - no push trigger: the PR run already tested the merged code;
# - a newer push to the same PR cancels the older run.
on:
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: ${{ fromJSON(github.base_ref == 'main' && '["ubuntu-latest","macos-latest","windows-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - run: go build .
      # The keychain code against the real thing: the macOS Keychain, Windows
      # Credential Manager, and on Linux a Secret Service started for the job.
      # Every other test uses a stand-in keychain, and swaps it in for the
      # rest of its process, so this test runs in a process of its own.
      - name: real keychain (Linux, set up a Secret Service)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gnome-keyring libsecret-tools
      - name: real keychain (Linux)
        if: runner.os == 'Linux'
        env:
          VAULTMCP_REAL_KEYCHAIN: "1"
        run: dbus-run-session -- bash -c "echo 'ci-keyring' | gnome-keyring-daemon --unlock && go test -count=1 -v -run TestRealKeychain ."
      - name: real keychain (macOS, Windows)
        if: runner.os != 'Linux'
        env:
          VAULTMCP_REAL_KEYCHAIN: "1"
        run: go test -count=1 -v -run TestRealKeychain .

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...
      - name: gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec ./...

  # Single required status check for branch rulesets.
  ci-ok:
    needs: [test, lint]
    runs-on: ubuntu-latest
    steps:
      - run: echo "all checks green"
